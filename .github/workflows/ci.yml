name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      - run: npx expo export --platform android --platform web --output-dir /tmp/export

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  # Its own job, so that an advisory published against an unchanged tree turns audit red
  # on the next run (on the default branch, the weekly one at the latest) and leaves check
  # meaning what it always meant. The gate runs npm audit, which reads the lockfile: no
  # install. It fails on every high or critical advisory .github/audit/accepted.json does not
  # accept (CONVENTIONS.md, "CI").
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node .github/audit/npm-audit.mjs
