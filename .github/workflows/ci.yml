name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (android + web)
        run: |
          npx expo export --platform android --output-dir /tmp/android-out
          npx expo export --platform web --output-dir /tmp/web-out
        env:
          CI: 1
