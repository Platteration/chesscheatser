# Publishes Two Kings Chess for browser testing; native store releases use EAS.
name: Deploy web build

on:
  push:
    branches: [codex/ui-readiness-fixes-20261010, main, master, claude/two-king-chess-app-k423c0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check chesscheatser before publishing
        run: npm run typecheck && npm test
        env:
          CI: 1
      - name: Configure repository URL prefix
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.experiments={...(a.expo.experiments||{}),baseUrl:'/'+process.env.REPOSITORY_NAME};fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - name: Export Two Kings Chess for the web
        run: npx expo export --platform web --output-dir dist-web
        env:
          CI: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-web
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
