# Publishes the web build to GitHub Pages so testers can play in a browser.
# Enable Pages for the repository (Settings → Pages → Source: GitHub Actions) once.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs `npm ci`, the unit tests and the Expo exporter, so it gets
# no more than read: anything in the dependency tree would otherwise hold a token
# that can publish the public site and mint an OIDC identity for this repository.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout uses git; without this the job's token is
          # left in .git/config for every later step to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The site is served from <user>.github.io/<repo>/, so every address in it carries /<repo>;
      # Pages reads none of the host configs in public/, so none is published; and the policy
      # goes into each page as a <meta>, Pages sending no headers (scripts/build-web.mjs).
      - name: Build the website for GitHub Pages
        run: node scripts/build-web.mjs --host github-pages --base-url "/$REPOSITORY" --output-dir dist-web
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      # From v4 the upload leaves out every path that starts with a dot unless told otherwise,
      # and the site's .well-known/security.txt is one.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
