# Publishes the web build to GitHub Pages so testers can play in a browser.
# Enable Pages for the repository (Settings → Pages → Source: GitHub Actions) once.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs `npm ci`, the unit tests and the Expo exporter, so it gets
# no more than read: anything in the dependency tree would otherwise hold a token
# that can publish the public site and mint an OIDC identity for this repository.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after the checkout uses git; without this the job's token is
          # left in .git/config for every later step to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The site is served from <user>.github.io/<repo>/, so every address in it carries /<repo>;
      # Pages reads none of the host configs in public/, so none is published; and the policy
      # goes into each page as a <meta>, Pages sending no headers (scripts/build-web.mjs).
      - name: Build the website for GitHub Pages
        run: node scripts/build-web.mjs --host github-pages --base-url "/$REPOSITORY" --output-dir dist-web
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
