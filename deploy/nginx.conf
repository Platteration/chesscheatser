# Two Kings Chess: nginx. Include this file from the http {} block (for example from
# /etc/nginx/conf.d/), then set server_name, root and the certificate paths. Netlify and
# Cloudflare Pages read public/_headers instead; Apache reads public/.htaccess. The header values
# are the same in all of them, and src/__tests__/website.test.ts fails when they differ;
# public/_headers says what each is for.
#
# root is the folder `node scripts/build-web.mjs --host nginx` writes (dist-web by default),
# copied to the server: never a git checkout, whose .git/ holds the whole history. The locations
# below serve the site's own files, hand api/ to the site's API (server/start.mjs: sign-in and the
# shop, off until its variables are set), and answer 404 for every other address, so a checkout
# published by mistake still gives away none of the repository's files.
# This serves the site at the root of its domain, and only there: the cache map and every
# location are written for paths that start at /. Build it without --base-url. A sub-path build
# belongs on a host that reads _headers or .htaccess, unless each of those patterns is rewritten
# to start with the path.

# Revalidated on every load, except what carries a content hash in its name, which a new build
# renames: the bundle under /_expo/static/ and the assets under /assets/.
map $uri $twokings_cache_control {
    default            "no-cache";
    ~^/_expo/static/   "public, max-age=31536000, immutable";
    ~^/assets/         "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    # The redirect names no version either.
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 is asked for on the listen lines: `http2 on;` is nginx 1.25.1 and later, and the
    # nginx 1.24 that Ubuntu 24.04 ships refuses the whole file over it ("unknown directive").
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    root /var/www/two-kings-chess;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # every address the site does not serve, a folder included, shows the site's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # The site's own files and nothing else; every other address, the repository's own files,
    # .git, node_modules and any .env among them, takes the catch-all's 404. The bundle and the
    # assets are matched by the content hash in their names. .well-known/ holds security.txt
    # and the certificate checks a webroot ACME client writes. api/config is the static answer
    # for a site with no API (sign-in and the shop off); while the API's location below is
    # there, its ^~ takes the whole of api/ before any of these is read.
    location = / {
        try_files /index.html =404;
    }
    location ~ "^/(index\.html|404\.html|site\.css|guard\.js|favicon\.ico|robots\.txt|api/config|\.well-known/security\.txt|\.well-known/acme-challenge/[A-Za-z0-9_-]+|_expo/static/js/web/[A-Za-z0-9_-]+-[0-9a-f]{32}\.js)$" {
        try_files $uri =404;
    }
    # nginx's own mime.types names neither of these
    location ~ "^/assets/([A-Za-z0-9_-]+/)+[A-Za-z0-9_-]+\.[0-9a-f]{32}\.[a-z0-9]+$" {
        types {
            font/ttf  ttf;
            audio/wav wav;
        }
        try_files $uri =404;
    }
    location / {
        return 404;
    }

    # Every add_header is here, at server level: nginx drops them all from a location that adds
    # one of its own, so none does but the API's below.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(self), compute-pressure=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $twokings_cache_control always;

    # The site's API (sign-in and the shop), on the same origin: server/start.mjs, the kit's Node
    # adapter, on 127.0.0.1:8788 (server/kit/README.md). ^~ wins over the regular expressions
    # above; proxy_pass has no URI, so the path reaches the kit unchanged. The kit sends its own
    # headers on every answer, so this location declares one add_header, which keeps the server
    # block's from being sent beside them (two Referrer-Policy or Cache-Control values, of which
    # a browser reads the last), and repeats the server block's Strict-Transport-Security line
    # exactly. Without the API running nginx would answer api/ with its own 502 page (504 when it
    # does not answer in time) and that one header: error_page answers with the site's not-found
    # page instead, its status kept, served by the location above with every header of the server
    # block, and the page draws no sign-in or shop. No proxy_intercept_errors, so the kit's own
    # answers (its JSON 404, 401, 409) pass through. Delete this block to serve the site without
    # the API, and the folder's api/config (above) answers that nothing is on.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        error_page 502 504 /404.html;
    }
}
