# Two Kings Chess: nginx. Include this file from the http {} block (for example from
# /etc/nginx/conf.d/), then set server_name, root and the certificate paths. Netlify and
# Cloudflare Pages read public/_headers instead; Apache reads public/.htaccess. The header values
# are the same in all of them, and src/__tests__/website.test.ts fails when they differ;
# public/_headers says what each is for.
#
# root is the folder `node scripts/build-web.mjs --host nginx` writes (dist-web by default),
# copied to the server: never a git checkout, whose .git/ holds the whole history. The rules
# below refuse the repository's own files anyway, in case one is.
# This serves the site at the domain root. For a sub-path, build with --base-url /<path>, serve
# the folder there with alias, and point error_page at /<path>/404.html. Write the alias as
# `location /<path>/ { alias /var/www/two-kings-chess/; }`, a slash at the end of both: a
# location without one also matches /<path>../, which alias then resolves to the folder above.

# Revalidated on every load, except what carries a content hash in its name, which a new build
# renames: the bundle under /_expo/static/ and the assets under /assets/.
map $uri $twokings_cache_control {
    default            "no-cache";
    ~^/_expo/static/   "public, max-age=31536000, immutable";
    ~^/assets/         "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    root /var/www/two-kings-chess;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # a missing page, and a folder with no index page, both show the site's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # never a dotfile (.git above all), except the folder RFC 9116 and certificate checks use
    location ~ /\.(?!well-known/) { return 404; }
    # the other hosts' configs, and the repository's own files if a checkout were published
    location ~ ^/(_headers|_redirects|README\.md|package\.json|deploy(/.*)?|public(/.*)?|src(/.*)?)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
    # nginx's own mime.types names neither of these
    location /assets/ {
        types {
            font/ttf  ttf;
            audio/wav wav;
        }
        try_files $uri =404;
    }

    # Every add_header is here, at server level: nginx drops them all from a location that adds
    # one of its own, so none does.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(self), compute-pressure=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $twokings_cache_control always;
}
